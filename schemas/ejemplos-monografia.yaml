# Ejemplos resueltos para el extractor de Tipo (few-shot)
# ---------------------------------------------------------------------------
# Estos 10 casos están redactados a mano siguiendo convenciones ISBD y
# MARC21 habituales en catalogación bibliotecaria en español: transcripción
# literal de la mención de responsabilidad; fecha del Área 4 con "D.L."
# cuando solo consta en depósito legal; series entre paréntesis con punto y
# coma antes del número; "(eds.)" tratado como mención de responsabilidad
# del Área 1 (no como Área 2); el ilustrador de cubierta NUNCA se añade
# como nota; etc.
#
# El YAML se copia dentro de la imagen en /app/schemas/, junto al esquema.
# No se descarga nada en tiempo de ejecución. Para regenerar a partir de
# registros MARCXML reales de la BNE, ver examples/construir_ejemplos_bne.py.
#
# Estructura de cada ejemplo:
#   descripcion : qué caso difícil ilustra
#   texto       : material simulado con las cabeceras de zona reales de Tipo
#   salida      : JSON con campos atómicos + bloques isbd_area_*

ejemplos:

