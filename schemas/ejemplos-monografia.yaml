# Ejemplos resueltos para el extractor de Tipo (few-shot)
# ---------------------------------------------------------------------------
# Cómo funciona:
#   El extractor (backend/app/extractor.py) carga este fichero al construir el
#   prompt e inyecta los primeros MAX_EJEMPLOS_PROMPT ejemplos como
#   demostraciones de extracción correcta. Si el fichero no existe, Tipo
#   funciona igual, solo que sin few-shot.
#
# Cómo se empaqueta "internamente" con la herramienta:
#   Este YAML se copia dentro de la imagen, en /app/schemas/, junto al esquema.
#   No se descarga nada en tiempo de ejecución: los ejemplos viajan con Tipo,
#   coherente con su filosofía local-first y sin dependencia de red.
#
# Sobre el origen de los ejemplos:
#   Son casos SINTÉTICOS construidos a mano siguiendo las convenciones de
#   descripción de la BNE y de ISBD (formato del depósito legal con sigla
#   provincial, ISBN-13 con guiones, transcripción literal de la mención de
#   responsabilidad, prioridad de portada sobre verso). NO reproducen ningún
#   registro concreto de la BNE: ilustran el método, no copian catálogo.
#   Para regenerarlos o ampliarlos a partir de registros reales, ver
#   examples/construir_ejemplos_bne.py.
#
# Estructura de cada ejemplo:
#   descripcion : qué caso difícil ilustra (no se envía como dato, orienta)
#   texto       : material simulado, con las cabeceras de zona reales de Tipo
#   salida      : JSON exactamente con la forma que Tipo espera del modelo

