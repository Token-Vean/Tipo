name: security-checks

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Prepare report placeholders
        run: |
          cat > pip-audit-results.json <<'JSON'
          {"status":"not-run"}
          JSON
          cat > sbom-python.cdx.json <<'JSON'
          {"bomFormat":"CycloneDX","specVersion":"1.6","version":1,"metadata":{"component":{"name":"Tipo","type":"application"}},"components":[]}
          JSON

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pip-audit cyclonedx-bom

      - name: Lint with Ruff
        run: ruff check backend/app tests

      - name: Run tests
        env:
          USAR_SANDBOX_PARSERS: "false"
          PYTHONPATH: ${{ github.workspace }}/backend
        run: pytest tests backend/tests -q

      - name: Audit Python dependencies (report only)
        if: always()
        continue-on-error: true
        run: |
          if command -v pip-audit >/dev/null 2>&1; then
            pip-audit -r backend/requirements.txt -f json -o pip-audit-results.json || true
          else
            cat > pip-audit-results.json <<'JSON'
            {"status":"not-run","reason":"pip-audit command not available"}
            JSON
          fi

      - name: pip-audit blocking gate (vulnerabilidades con corrección disponible)
        # A diferencia del step "report only" anterior, este SÍ bloquea el build.
        # Falla si hay vulnerabilidades conocidas CON versión corregida disponible.
        # Las que no tienen fix aún no bloquean (se revisan en el informe).
        # Excepciones puntuales y justificadas: añadir el ID a --ignore-vuln,
        # SIEMPRE con un comentario que explique por qué se acepta y hasta cuándo.
        run: |
          pip-audit -r backend/requirements.txt --strict
          # Ejemplo de excepción temporal (mantener comentado si no se usa):
          #   pip-audit -r backend/requirements.txt \
          #     --ignore-vuln GHSA-xxxx-xxxx-xxxx  # motivo + fecha de revisión

      - name: Generate Python SBOM CycloneDX
        if: always()
        continue-on-error: true
        run: |
          if command -v cyclonedx-py >/dev/null 2>&1; then
            cyclonedx-py environment -o sbom-python.cdx.json || \
            cyclonedx-py requirements backend/requirements.txt -o sbom-python.cdx.json || \
            python - <<'PY'
          import json
          from pathlib import Path
          Path('sbom-python.cdx.json').write_text(json.dumps({
              'bomFormat': 'CycloneDX',
              'specVersion': '1.6',
              'version': 1,
              'metadata': {'component': {'name': 'Tipo', 'type': 'application'}},
              'components': [],
              'properties': [{'name': 'tipo.sbom.status', 'value': 'fallback-generated'}]
          }, indent=2), encoding='utf-8')
          PY
          else
            python - <<'PY'
          import json
          from pathlib import Path
          Path('sbom-python.cdx.json').write_text(json.dumps({
              'bomFormat': 'CycloneDX',
              'specVersion': '1.6',
              'version': 1,
              'metadata': {'component': {'name': 'Tipo', 'type': 'application'}},
              'components': [],
              'properties': [{'name': 'tipo.sbom.status', 'value': 'cyclonedx-py-not-available'}]
          }, indent=2), encoding='utf-8')
          PY
          fi

      - name: Add Python security summary
        if: always()
        run: |
          echo "## Python security scan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Ruff, tests y pip-audit (vulns con fix disponible) son bloqueantes. El informe pip-audit se sube como artefacto." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f pip-audit-results.json ]; then
            echo "pip-audit-results.json generated." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f sbom-python.cdx.json ]; then
            echo "sbom-python.cdx.json generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Python security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-security-reports
          if-no-files-found: ignore
          path: |
            pip-audit-results.json
            sbom-python.cdx.json

  docker-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Prepare Docker report placeholders
        run: |
          printf 'Trivy report not generated yet.\n' > trivy-image-table.txt
          cat > trivy-image.json <<'JSON'
          {"status":"not-run"}
          JSON
          cat > sbom-image.cdx.json <<'JSON'
          {"bomFormat":"CycloneDX","specVersion":"1.6","version":1,"metadata":{"component":{"name":"tipo-app","type":"container"}},"components":[]}
          JSON
          cat > sbom-image.spdx.json <<'JSON'
          {"spdxVersion":"SPDX-2.3","dataLicense":"CC0-1.0","SPDXID":"SPDXRef-DOCUMENT","name":"tipo-app","documentNamespace":"https://example.invalid/tipo/not-run"}
          JSON

      - name: Build application image
        run: docker build -t tipo-app:ci ./backend

      - name: Trivy image scan report (HIGH/CRITICAL, non-blocking)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: tipo-app:ci
          format: table
          output: trivy-image-table.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
          scanners: vuln

      - name: Trivy image scan JSON (HIGH/CRITICAL, non-blocking)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: tipo-app:ci
          format: json
          output: trivy-image.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
          scanners: vuln

      - name: Trivy blocking gate (fixed CRITICAL only)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: tipo-app:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          scanners: vuln

      - name: Generate image SBOM CycloneDX with Trivy
        if: always()
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: tipo-app:ci
          format: cyclonedx
          output: sbom-image.cdx.json
          exit-code: '0'
          scanners: vuln

      - name: Generate image SBOM SPDX with Trivy
        if: always()
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: tipo-app:ci
          format: spdx-json
          output: sbom-image.spdx.json
          exit-code: '0'
          scanners: vuln

      - name: Scan image with Grype (report only)
        uses: anchore/scan-action@v7
        continue-on-error: true
        with:
          image: tipo-app:ci
          fail-build: false
          severity-cutoff: high

      - name: Check repository does not include local secrets/state
        run: |
          set -euo pipefail
          echo "Checking only files tracked by Git, not temporary files created by security tools."
          tracked_files="$(git ls-files)"

          if printf '%s\n' "$tracked_files" | grep -E '(^|/)\.env$'; then
            echo "ERROR: .env no debe estar versionado en el repositorio"
            exit 1
          fi

          if printf '%s\n' "$tracked_files" | grep -E '(^|/)(users\.json|.*\.sqlite|.*\.sqlite3|.*\.db)$'; then
            echo "ERROR: no debe haber bases locales ni users.json versionados en el repositorio"
            exit 1
          fi

          echo "OK - No hay .env, bases locales ni users.json versionados."

      - name: Add Docker security summary
        if: always()
        run: |
          echo "## Docker security scan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Trivy HIGH/CRITICAL report is uploaded as artifact. The workflow only blocks on fixed CRITICAL vulnerabilities." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f trivy-image-table.txt ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            sed -n '1,200p' trivy-image-table.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Docker security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-security-reports
          if-no-files-found: ignore
          path: |
            trivy-image-table.txt
            trivy-image.json
            sbom-image.cdx.json
            sbom-image.spdx.json
