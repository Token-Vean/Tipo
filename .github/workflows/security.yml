name: security-checks

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pip-audit cyclonedx-bom

      - name: Lint with Ruff
        run: ruff check backend/app tests

      - name: Run tests
        env:
          USAR_SANDBOX_PARSERS: "false"
          PYTHONPATH: ${{ github.workspace }}/backend
        run: pytest tests backend/tests -q

      - name: Audit Python dependencies
        run: pip-audit -r backend/requirements.txt -f json -o pip-audit-results.json

      - name: Generate Python SBOM CycloneDX
        run: cyclonedx-py requirements -i backend/requirements.txt -o sbom-python.cdx.json

      - name: Upload Python security reports
        uses: actions/upload-artifact@v4
        with:
          name: python-security-reports
          path: |
            pip-audit-results.json
            sbom-python.cdx.json

  docker-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build application image
        run: docker build -t tipo-app:ci ./backend

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: tipo-app:ci
          format: json
          output: trivy-image.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Generate image SBOM CycloneDX with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: tipo-app:ci
          format: cyclonedx
          output: sbom-image.cdx.json
          exit-code: '0'

      - name: Generate image SBOM SPDX with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: tipo-app:ci
          format: spdx-json
          output: sbom-image.spdx.json
          exit-code: '0'

      - name: Scan image with Grype
        uses: anchore/scan-action@v6
        with:
          image: tipo-app:ci
          fail-build: true
          severity-cutoff: high

      - name: Check repository does not include local secrets/state
        run: |
          if find . -name .env -print -quit | grep -q .; then
            echo "ERROR: .env no debe estar en el repositorio ni en el paquete de release"
            exit 1
          fi
          if find . \( -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.db' -o -name 'users.json' \) -print -quit | grep -q .; then
            echo "ERROR: no debe haber bases locales ni users.json en el repositorio"
            exit 1
          fi

      - name: Upload Docker security reports
        uses: actions/upload-artifact@v4
        with:
          name: docker-security-reports
          path: |
            trivy-image.json
            sbom-image.cdx.json
            sbom-image.spdx.json
